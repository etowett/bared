name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight PR runs, but never cancel a push to main: a main push feeds
# auto-release.yml, and killing that halfway can skip a release or leave the tag
# state inconsistent. `head_ref` is set only for pull_request, so PR runs group by
# source branch while push runs group by ref — `github.ref` alone would lump every
# PR under refs/pull/N/merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    # Sized generously against observed runtime: this is here to kill a hang
    # before it burns six hours of the default, not to police a slow run.
    timeout-minutes: 20

    steps:
      # persist-credentials: false — nothing in this job pushes, so there is no
      # reason to leave the token in .git/config where any build step, test or
      # transitive dependency can read it.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev \
            default-mysql-client \
            postgresql-client \
            redis-tools

      # No placeholder dist needed: the .gitkeep under
      # apps/api/internal/web/dist is tracked (#78), so `//go:embed all:dist`
      # matches straight out of the checkout.

      # The profile is written to the workspace root because that is where the
      # Makefile's COVERAGE_OUT points; the next step reads it from there.
      - name: Run tests
        working-directory: apps/api
        env:
          CGO_ENABLED: "1"
        run: go test -race -coverprofile="${GITHUB_WORKSPACE}/coverage.out" ./...

      # The coverage ratchet is part of `make pre-commit`, so CI has to enforce
      # it too — otherwise it rots the way it did before #53. This reuses the
      # profile above instead of re-running the suite.
      - name: Check coverage ratchet
        run: make coverage-verify

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # No placeholder dist needed: the .gitkeep under
      # apps/api/internal/web/dist is tracked (#78), so `//go:embed all:dist`
      # matches straight out of the checkout.

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pinned rather than `latest`: a new golangci-lint release turns green
          # CI red with no change on our side, and `latest` re-resolves on every
          # run. Bump deliberately.
          version: v2.12.2
          working-directory: apps/api
          args: --timeout=5m

  agent-config:
    name: Agent Config
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # .claude/ is canonical and .codex/ mirrors it; without this the Codex
      # setup rots silently. See .claude/AGENTS.md for the sync map.
      - name: Check agent config mirrors
        run: make agents-doctor

      - name: Check hook scripts are valid shell
        run: bash -n .claude/hooks/*.sh

      - name: Test the hooks
        run: ./scripts/test-agent-hooks.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      # setup-bun caches the Bun binary only — it does not touch the dependency
      # install cache — so this replaces what `cache: "npm"` used to do.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build web frontend
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run build

      # No copy step: apps/api/internal/web/dist now exists in the checkout (the
      # tracked .gitkeep from #78), so `cp -r apps/web/dist <dir>` would nest a
      # dist/dist inside it rather than replace it. `make build` runs
      # `web-sync-dist`, which syncs the assets without clobbering the .gitkeep.
      - name: Build binary with embedded web
        run: make build CGO=1

      - name: Validate example config
        run: make validate CGO=1
