name: Auto Release

on:
  push:
    branches:
      - main

# auto-release, release and docker share one `release` group so two releases can
# never interleave. Never cancel: aborting mid-flight can leave a tag with no
# release behind it, or a release with no image. Queueing is the cheaper failure.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release:
    name: Create Release Tag
    runs-on: [ubuntu-latest]
    # The repository guard keeps this out of forks, where secrets.PAT_TOKEN is
    # empty and every gh call would fail red instead of skipping cleanly.
    if: ${{ github.repository == 'etowett/bared' && !contains(github.event.head_commit.message, '[skip ci]') }}
    # Short by design: this job is a handful of gh calls and a tag push. If it
    # is still running after ten minutes something is stuck, and it is holding
    # PAT_TOKEN while it waits.
    timeout-minutes: 10

    steps:
      # DO NOT remove `token:` — the whole release chain depends on it.
      #
      # This job pushes a vX.Y.Z tag, and GitHub deliberately does NOT trigger
      # workflows for refs pushed with the default GITHUB_TOKEN (loop
      # prevention). release.yml triggers on `push: tags: v*.*.*` and docker.yml
      # triggers on release.yml completing, so with GITHUB_TOKEN this job mints
      # orphan tags and neither downstream workflow ever fires.
      #
      # PR #36 (f8f9eaa) dropped this line and the breakage went unnoticed for
      # four months — v0.3.3, v0.3.7 and v0.3.8 are tagged with no Release run
      # behind them. Restoring PAT_TOKEN here makes the tag push come from a
      # real user, which does propagate.
      #
      # Substitutes, if PAT_TOKEN is ever retired: a GitHub App installation
      # token, or having this job call release.yml via `gh workflow run`.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      # `gh` is preinstalled on ubuntu-latest, so there is no bootstrap step
      # here. Anything that adds an apt key and installs packages inside the one
      # job that holds PAT_TOKEN needs to earn its place, and this did not.

      - name: Get merged PR number
        id: pr
        run: |
          PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            echo "No merged PR found for this commit, skipping release"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${PR_NUMBER}" >> $GITHUB_OUTPUT
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Check for release:skip label
        id: check_skip
        if: steps.pr.outputs.skip == 'false'
        run: |
          LABELS=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -q "release:skip"; then
            echo "Release skipped due to release:skip label"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Get latest tag
        id: get_tag
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          # --match is load-bearing. Every release also pushes a module tag
          # (apps/api/vX.Y.Z — see "Create and push tags" below), and a bare
          # `git describe --tags --abbrev=0` returns THAT one: git sorts the two
          # tags on the same commit and "apps/api/v0.5.0" wins. The next step
          # would then strip the leading "v" off nothing, split "apps/api/v0" on
          # ".", and do arithmetic on a non-number. Restricting to root vX.Y.Z
          # tags keeps the version maths reading the version tags only.
          LATEST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "Latest tag: ${LATEST_TAG}"

      - name: Determine version bump
        id: version_bump
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          LABELS=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json labels --jq '.labels[].name')

          if echo "$LABELS" | grep -q "release:major"; then
            echo "bump=major" >> $GITHUB_OUTPUT
            echo "Version bump: major"
          elif echo "$LABELS" | grep -q "release:minor"; then
            echo "bump=minor" >> $GITHUB_OUTPUT
            echo "Version bump: minor"
          elif echo "$LABELS" | grep -q "release:patch"; then
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Version bump: patch"
          else
            echo "bump=patch" >> $GITHUB_OUTPUT
            echo "Version bump: patch (default)"
          fi
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Calculate next version
        id: next_version
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          CURRENT="${{ steps.get_tag.outputs.latest_tag }}"
          BUMP="${{ steps.version_bump.outputs.bump }}"

          # Remove 'v' prefix if present
          CURRENT=${CURRENT#v}

          # Split version into components
          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT"
          MAJOR="${VERSION_PARTS[0]:-0}"
          MINOR="${VERSION_PARTS[1]:-0}"
          PATCH="${VERSION_PARTS[2]:-0}"

          # Calculate next version based on bump type
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEXT_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next_version=${NEXT_VERSION}" >> $GITHUB_OUTPUT
          echo "Next version: ${NEXT_VERSION}"

      # Every release pushes TWO tags for the same commit:
      #
      #   vX.Y.Z            the release tag. Triggers release.yml -> GoReleaser
      #                     -> GitHub release -> docker.yml. This is the tag
      #                     humans and the changelog refer to.
      #   apps/api/vX.Y.Z   the Go module tag. go.mod lives at apps/api/, so the
      #                     module is github.com/etowett/bared/apps/api, and Go
      #                     only accepts tags prefixed with the module's
      #                     subdirectory as versions of it. Without this tag
      #                     `go install .../cmd/brd@latest` silently installs a
      #                     pseudo-version of main's tip instead of the release,
      #                     and `@vX.Y.Z` fails outright with
      #                     "unknown revision apps/api/vX.Y.Z". See issue #106.
      #
      # --atomic is what keeps them from drifting: git either updates both refs
      # or neither, so a re-run that collides on one tag cannot leave the other
      # half-published. Without it, a rejected module tag would still leave a
      # release tag behind and ship a release `go install` cannot see.
      #
      # This does NOT double-fire release.yml. That workflow filters on
      # `tags: v*.*.*`, and GitHub's ref filter `*` does not match `/`, so
      # `apps/api/v0.5.0` fails the pattern (it does not even start with "v").
      # Only the vX.Y.Z ref triggers a build.
      - name: Create and push tags
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          NEXT_VERSION="${{ steps.next_version.outputs.next_version }}"
          MODULE_TAG="apps/api/${NEXT_VERSION}"
          PR_TITLE=$(gh pr view ${{ steps.pr.outputs.pr_number }} --json title --jq '.title')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${NEXT_VERSION}" -m "Release ${NEXT_VERSION}" -m "" -m "${PR_TITLE}"
          git tag -a "${MODULE_TAG}" -m "Release ${NEXT_VERSION}" -m "" -m "${PR_TITLE}"

          git push --atomic origin "${NEXT_VERSION}" "${MODULE_TAG}"

          echo "✅ Created and pushed tags: ${NEXT_VERSION} and ${MODULE_TAG}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Generate summary
        if: steps.check_skip.outputs.skip == 'false'
        run: |
          echo "## 🚀 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.next_version.outputs.next_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Previous:** ${{ steps.get_tag.outputs.latest_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Bump Type:** ${{ steps.version_bump.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ steps.pr.outputs.pr_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:** \`${{ steps.next_version.outputs.next_version }}\` (release) + \`apps/api/${{ steps.next_version.outputs.next_version }}\` (Go module)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The release workflow will now build binaries and create a GitHub release." >> $GITHUB_STEP_SUMMARY

      - name: Generate skip summary
        if: steps.check_skip.outputs.skip == 'true' || steps.pr.outputs.skip == 'true'
        run: |
          echo "## ⏭️ Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.pr.outputs.skip }}" == "true" ]; then
            echo "No merged PR found for this commit." >> $GITHUB_STEP_SUMMARY
          else
            echo "PR #${{ steps.pr.outputs.pr_number }} has the \`release:skip\` label." >> $GITHUB_STEP_SUMMARY
          fi
