# Label definitions for BareD
#
# These labels are synced to the repository via the sync-labels workflow, which
# runs the labeler with `skip-delete: false` — so this file is the complete,
# authoritative set. Any label not listed here is DELETED from the repo on the
# next sync, which is why the Dependabot labels live here too even though they
# aren't release labels.

# Release labels — consumed by .github/workflows/auto-release.yml
- name: "release:major"
  color: "d73a4a"
  description: "Breaking changes - triggers major version bump (x.0.0)"

- name: "release:minor"
  color: "0e8a16"
  description: "New features - triggers minor version bump (0.x.0)"

- name: "release:patch"
  color: "0075ca"
  description: "Bug fixes and small improvements - triggers patch version bump (0.0.x)"

- name: "release:skip"
  color: "ffffff"
  description: "Skip release - no version bump or release will be created"

# Dependency labels — applied by .github/dependabot.yml. Colours match the ones
# Dependabot created on the repo, so syncing is a no-op rather than a recolour.
- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "javascript"
  color: "168700"
  description: "Pull requests that update javascript code"

# Community labels — GitHub's defaults, restored here because `skip-delete:
# false` had already removed them from the repo. CONTRIBUTING.md points
# contributors at the `question` label, and `good first issue` / `help wanted`
# matter more once the repo is public. Colours and descriptions are GitHub's
# stock values so recreating them looks identical to the originals.
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"
