name: Docker

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ektowett/bared

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: [self-hosted, bared]
    environment: prod
    # Only run if the Release workflow succeeded
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          # Get commit SHA (short)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          # Get build date (RFC3339 format)
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Extract version from the release that triggered this workflow
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            # Get the latest tag (which should be the one just created by the release workflow)
            git fetch --tags
            VERSION=$(git tag --sort=-creatordate | head -n 1)
            if [[ "$VERSION" == v*.*.* ]]; then
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "is_tag=true" >> $GITHUB_OUTPUT
              echo "Detected version from workflow_run: $VERSION"
            else
              echo "version=main-${COMMIT_SHA}" >> $GITHUB_OUTPUT
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "No valid tag found, using main-${COMMIT_SHA}"
            fi
          else
            # Manual workflow_dispatch - try to find tag at current commit
            VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "main-${COMMIT_SHA}")
            if [[ "$VERSION" == v*.*.* ]]; then
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "is_tag=true" >> $GITHUB_OUTPUT
              echo "Detected version from manual dispatch: $VERSION"
            else
              echo "version=main-${COMMIT_SHA}" >> $GITHUB_OUTPUT
              echo "is_tag=false" >> $GITHUB_OUTPUT
              echo "No valid tag found, using main-${COMMIT_SHA}"
            fi
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            # For tagged releases: v1.2.3 -> 1.2.3, 1.2, 1, latest
            type=semver,pattern={{version}},value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=semver,pattern={{major}},value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_tag == 'true' }}
            # Fallback for non-release builds
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'false' }}
          labels: |
            org.opencontainers.image.title=BareD
            org.opencontainers.image.description=Backup and Restore Daemon for databases
            org.opencontainers.image.vendor=ektowett
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: |
            type=gha,scope=buildkit-${{ github.ref_name }}
            type=gha,scope=buildkit-main
          cache-to: type=gha,mode=max,scope=buildkit-${{ github.ref_name }}

      - name: Generate build summary
        run: |
          echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.meta.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ steps.meta.outputs.commit_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Date:** ${{ steps.meta.outputs.build_date }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags Pushed:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.docker_meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# Pull latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_IMAGE }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.meta.outputs.is_tag }}" == "true" ]]; then
            VERSION_TAG=$(echo "${{ steps.meta.outputs.version }}" | sed 's/^v//')
            echo "# Pull specific version" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.REGISTRY_IMAGE }}:${VERSION_TAG}" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Update Docker Hub description
        if: steps.meta.outputs.is_tag == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_IMAGE }}
          short-description: "BareD - Backup and Restore Daemon for MySQL, PostgreSQL, Redis"
          readme-filepath: ./README.md
