name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Get version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build web frontend
      run: |
        cd web
        npm ci
        npm run build
        cd ..
        echo "Web frontend built successfully"
        ls -lh web/dist/

    - name: Copy web dist to embed location
      run: |
        mkdir -p internal/web
        cp -r web/dist internal/web/dist
        echo "Web frontend copied to internal/web/dist for embedding"

    - name: Build binaries
      run: |
        mkdir -p dist
        VERSION=${{ steps.get_version.outputs.VERSION }}
        COMMIT=$(git rev-parse --short HEAD)
        BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        LDFLAGS="-X bared/internal/version.Version=${VERSION} -X bared/internal/version.Commit=${COMMIT} -X bared/internal/version.BuildDate=${BUILD_DATE}"

        # Linux amd64
        CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/brd-linux-amd64 ./cmd/brd

        # Linux arm64
        CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/brd-linux-arm64 ./cmd/brd

        # macOS amd64
        CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/brd-darwin-amd64 ./cmd/brd

        # macOS arm64
        CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "${LDFLAGS}" -o dist/brd-darwin-arm64 ./cmd/brd

        # Windows amd64
        CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -o dist/brd-windows-amd64.exe ./cmd/brd

        echo "All binaries built with embedded web frontend"

    - name: Verify binaries
      run: |
        cd dist
        for file in brd-*; do
          if [ ! -s "$file" ]; then
            echo "Error: $file is empty or missing"
            exit 1
          fi
          echo "✓ Verified: $file ($(du -h "$file" | cut -f1))"
        done
        echo "All binaries verified successfully"

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Create release archives
      run: |
        cd dist
        tar czf brd-linux-amd64.tar.gz brd-linux-amd64
        tar czf brd-linux-arm64.tar.gz brd-linux-arm64
        tar czf brd-darwin-amd64.tar.gz brd-darwin-amd64
        tar czf brd-darwin-arm64.tar.gz brd-darwin-arm64
        zip brd-windows-amd64.zip brd-windows-amd64.exe

    - name: Generate changelog
      id: changelog
      run: |
        if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        else
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "* Initial release" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/brd-linux-amd64.tar.gz
          dist/brd-linux-arm64.tar.gz
          dist/brd-darwin-amd64.tar.gz
          dist/brd-darwin-arm64.tar.gz
          dist/brd-windows-amd64.zip
          dist/checksums.txt
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Installation

          Download the appropriate binary for your platform and extract it:

          ```bash
          # Linux (amd64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/brd-linux-amd64.tar.gz
          tar xzf brd-linux-amd64.tar.gz
          sudo mv brd-linux-amd64 /usr/local/bin/brd

          # macOS (arm64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/brd-darwin-arm64.tar.gz
          tar xzf brd-darwin-arm64.tar.gz
          sudo mv brd-darwin-arm64 /usr/local/bin/brd
          ```

          Verify the download:
          ```bash
          sha256sum -c checksums.txt
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
