name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Get version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        mkdir -p dist

        # Linux amd64
        GOOS=linux GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/brd-linux-amd64 ./cmd/brd

        # Linux arm64
        GOOS=linux GOARCH=arm64 go build -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/brd-linux-arm64 ./cmd/brd

        # macOS amd64
        GOOS=darwin GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/brd-darwin-amd64 ./cmd/brd

        # macOS arm64
        GOOS=darwin GOARCH=arm64 go build -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/brd-darwin-arm64 ./cmd/brd

        # Windows amd64
        GOOS=windows GOARCH=amd64 go build -ldflags "-X main.Version=${{ steps.get_version.outputs.VERSION }}" -o dist/brd-windows-amd64.exe ./cmd/brd

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Create release archives
      run: |
        cd dist
        tar czf brd-linux-amd64.tar.gz brd-linux-amd64
        tar czf brd-linux-arm64.tar.gz brd-linux-arm64
        tar czf brd-darwin-amd64.tar.gz brd-darwin-amd64
        tar czf brd-darwin-arm64.tar.gz brd-darwin-arm64
        zip brd-windows-amd64.zip brd-windows-amd64.exe

    - name: Generate changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"* %s (%h)" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          dist/brd-linux-amd64.tar.gz
          dist/brd-linux-arm64.tar.gz
          dist/brd-darwin-amd64.tar.gz
          dist/brd-darwin-arm64.tar.gz
          dist/brd-windows-amd64.zip
          dist/checksums.txt
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Installation

          Download the appropriate binary for your platform and extract it:

          ```bash
          # Linux (amd64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/brd-linux-amd64.tar.gz
          tar xzf brd-linux-amd64.tar.gz
          sudo mv brd-linux-amd64 /usr/local/bin/brd

          # macOS (arm64)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.VERSION }}/brd-darwin-arm64.tar.gz
          tar xzf brd-darwin-arm64.tar.gz
          sudo mv brd-darwin-arm64 /usr/local/bin/brd
          ```

          Verify the download:
          ```bash
          sha256sum -c checksums.txt
          ```
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
