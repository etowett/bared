name: Web Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      # The Dockerfile carries a second Bun pin that must match
      # apps/web/.bun-version, and only the check-bun-pin step below enforces
      # that. Dependabot's docker ecosystem bumps the Dockerfile alone (it did in
      # #64), so a Dockerfile-only change has to trigger this workflow.
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "Dockerfile"
      - "Makefile"
      - ".github/workflows/web-ci.yml"

# See the note in ci.yml: cancel superseded PR runs only, never a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Nothing here pushes, so the token does not need to survive the checkout.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Runs before Setup Bun deliberately: if the two pins disagree, the version
      # this job would install is already ambiguous, so fail before installing.
      - name: Check Bun pin consistency
        run: make check-bun-pin

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      # setup-bun caches the Bun binary only — it does not touch the dependency
      # install cache — so this replaces what `cache: "npm"` used to do.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Validate
        working-directory: apps/web
        run: bun run validate

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Check build output
        run: |
          if [ ! -f "apps/web/dist/index.html" ]; then
            echo "Error: index.html not found in build output"
            exit 1
          fi
