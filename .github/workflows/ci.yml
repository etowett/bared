name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede in-flight PR runs, but never cancel a push to main: a main push feeds
# auto-release.yml, and killing that halfway can skip a release or leave the tag
# state inconsistent. `head_ref` is set only for pull_request, so PR runs group by
# source branch while push runs group by ref — `github.ref` alone would lump every
# PR under refs/pull/N/merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev \
            default-mysql-client \
            postgresql-client \
            redis-tools

      - name: Create placeholder web dist
        run: |
          mkdir -p apps/api/internal/web/dist
          echo "placeholder" > apps/api/internal/web/dist/.placeholder

      - name: Run tests
        working-directory: apps/api
        env:
          CGO_ENABLED: "1"
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Create placeholder dist directory
        run: |
          mkdir -p apps/api/internal/web/dist
          echo "placeholder" > apps/api/internal/web/dist/.placeholder

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: apps/api
          args: --timeout=5m

  agent-config:
    name: Agent Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # .claude/ is canonical and .codex/ mirrors it; without this the Codex
      # setup rots silently. See .claude/AGENTS.md for the sync map.
      - name: Check agent config mirrors
        run: make agents-doctor

      - name: Check hook scripts are valid shell
        run: bash -n .claude/hooks/*.sh

      - name: Test the hooks
        run: ./scripts/test-agent-hooks.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      # setup-bun caches the Bun binary only — it does not touch the dependency
      # install cache — so this replaces what `cache: "npm"` used to do.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build web frontend
        working-directory: apps/web
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Copy web dist to embed location
        run: cp -r apps/web/dist apps/api/internal/web/dist

      - name: Build binary with embedded web
        run: make build CGO=1

      - name: Validate example config
        run: make validate CGO=1
