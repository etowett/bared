version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck      # Check for unchecked errors
    - gosimple      # Simplify code
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Static analysis
    - unused        # Check for unused code
    - misspell      # Check for misspelled words
    - revive        # Fast, configurable, extensible, flexible, and beautiful linter
    - unconvert     # Remove unnecessary type conversions
    - unparam       # Report unused function parameters
    - gosec         # Security checks

  exclusions:
    paths:
      - vendor
      - examples
    rules:
      # Exclude some linters from running on tests
      - path: _test\.go
        linters:
          - errcheck
          - gosec

settings:
  errcheck:
    check-blank: true
    check-type-assertions: true

  govet:
    settings:
      shadow:
        strict: true

  revive:
    confidence: 0.8

  gosec:
    excludes:
      - G204  # Subprocess launched with variable (we need this for database commands)
      - G401  # Use of weak cryptographic primitive (we're not doing crypto)

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
