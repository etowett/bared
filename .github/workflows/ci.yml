name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: [web]
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.5']

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Install database tools (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          default-mysql-client \
          postgresql-client \
          redis-tools

    - name: Install database tools (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install mysql-client postgresql redis
        # mysql-client is keg-only, so its binaries (e.g. mysqldump) are not on PATH by default.
        echo "$(brew --prefix mysql-client)/bin" >> "$GITHUB_PATH"
        # Ensure common DB tool bins are on PATH regardless of Homebrew prefix.
        if brew --prefix postgresql@14 >/dev/null 2>&1; then
          echo "$(brew --prefix postgresql@14)/bin" >> "$GITHUB_PATH"
        else
          echo "$(brew --prefix postgresql)/bin" >> "$GITHUB_PATH"
        fi
        echo "$(brew --prefix redis)/bin" >> "$GITHUB_PATH"

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Download dependencies
      run: go mod download

    - name: Download web artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: internal/web/dist
      continue-on-error: true

    - name: Create placeholder dist if needed
      run: |
        if [ ! -d "internal/web/dist" ]; then
          mkdir -p internal/web/dist
          echo "placeholder" > internal/web/dist/.placeholder
        fi

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && startsWith(matrix.go-version, '1.25')
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.out
        flags: unittests

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'

    - name: Create placeholder dist directory
      run: |
        mkdir -p internal/web/dist
        echo "placeholder" > internal/web/dist/.placeholder

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout=5m

  web:
    name: Web Frontend
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: web/.nvmrc
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Validate web frontend
      working-directory: web
      run: npm run validate

    - name: Build web frontend
      working-directory: web
      run: npm run build

    - name: Upload web artifacts
      uses: actions/upload-artifact@v5
      with:
        name: web-dist
        path: web/dist
        retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint, web]

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25.5'

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: web/.nvmrc
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Download web artifacts
      uses: actions/download-artifact@v4
      with:
        name: web-dist
        path: web/dist

    - name: Build binary with embedded web
      run: make build

    - name: Validate example config
      run: make validate

    - name: Upload binary
      uses: actions/upload-artifact@v5
      with:
        name: brd
        path: bin/brd
