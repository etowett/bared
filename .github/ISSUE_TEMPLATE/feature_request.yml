name: Feature request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        BareD aims to stay small and stdlib-first. The most useful feature requests
        explain the problem concretely — that makes it much easier to judge whether
        a feature belongs in the core or is better solved with configuration.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched [existing issues](https://github.com/etowett/bared/issues?q=is%3Aissue) and this is not a duplicate
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation you're in, not the solution you have in mind.
      placeholder: |
        We back up to Azure Blob Storage across the whole estate. BareD supports
        local, S3 and SFTP, so we'd have to run MinIO purely as a shim.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like BareD to do?
      description: If it affects configuration, sketch the YAML you'd expect to write.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this touch?
      multiple: true
      options:
        - Database engine (Dumper/Restorer)
        - Storage backend
        - Notification channel
        - Compression or encryption
        - Daemon or scheduling
        - REST API or WebSocket
        - Web dashboard
        - CLI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds you tried, other tools you looked at, and why they didn't fit.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to work on this myself
