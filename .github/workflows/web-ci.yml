name: Web Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      # setup-bun caches the Bun binary only — it does not touch the dependency
      # install cache — so this replaces what `cache: "npm"` used to do.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Validate
        working-directory: apps/web
        run: bun run validate

      - name: Build
        working-directory: apps/web
        run: bun run build

      - name: Check build output
        run: |
          if [ ! -f "apps/web/dist/index.html" ]; then
            echo "Error: index.html not found in build output"
            exit 1
          fi
