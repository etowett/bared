# BareD Configuration Example
# Complete configuration with all features demonstrated

# Default storage backend for all targets
default_storage: s3

# Logging configuration (optional)
# Configure structured logging with slog
log_level: info              # Levels: debug, info, warn, error (default: info)
log_format: auto             # Formats: json, text, auto (default: auto)
                             # - json: Structured JSON logs (best for production, log aggregators)
                             # - text: Human-readable text logs (best for development)
                             # - auto: JSON in production, text in development (based on BARED_ENV)
log_options:
  add_source: false          # Add file:line to log entries (useful for debugging)
  # time_format: RFC3339     # Custom time format (optional, defaults to RFC3339)

# Persistence configuration (optional)
# Store job history and logs in database
persistence:
  enabled: true
  type: sqlite3              # Currently only sqlite3 is supported
  dsn: bared.db              # Database file path (or connection string for other DBs)
  # Features:
  # - Job history survives daemon restart
  # - Historical log retrieval via API
  # - Distributed locking for multi-instance deployments

# Storage backend definitions
storages:
  # Local filesystem storage
  local_disk:
    type: local
    path: /data/backups
    keep: 20

  # S3 or S3-compatible storage (MinIO, DigitalOcean Spaces, Backblaze B2, etc.)
  s3:
    type: s3
    bucket: my-backup-bucket
    region: us-east-1
    access_key_id: ${AWS_ACCESS_KEY_ID}
    secret_access_key: ${AWS_SECRET_ACCESS_KEY}
    # endpoint_url: https://s3.example.com  # For S3-compatible services
    path: backups/
    keep: 30

  # SFTP remote storage
  offsite:
    type: sftp
    host: backup.example.com
    port: 22
    username: backup
    password: ${SFTP_PASSWORD}
    path: /backups/
    keep: 90

# Notification definitions
# Multiple notifiers can be configured and will all receive notifications
notifiers:
  # Slack notifications with rich formatting
  slack-team:
    type: slack
    url: https://hooks.slack.com/services/YOUR/WEBHOOK/URL
    on_success: false  # Set to true to get success notifications
    # Features:
    # - Compression metrics (size reduction %)
    # - Storage and database details
    # - Manual vs scheduled indicator
    # - Stage timeline with durations
    # - Support for both backup and restore notifications

  # Email notifications with HTML formatting
  email-admins:
    type: email
    on_success: true   # Send both success and failure emails
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_username: backups@company.com
    smtp_password: ${SMTP_PASSWORD}  # Use environment variables for security
    smtp_from: backups@company.com
    smtp_to:
      - admin@company.com
      - ops-team@company.com
    smtp_use_tls: true
    # Features:
    # - Beautiful HTML emails with responsive design
    # - Color-coded (green for success, red for failure)
    # - All metrics displayed in organized sections
    # - Mobile-friendly layout
    # - Automatic retries (3 attempts with exponential backoff)

  # Email notification for failures only (production monitoring)
  email-oncall:
    type: email
    on_success: false  # Only failures
    smtp_host: smtp.office365.com
    smtp_port: 587
    smtp_username: alerts@company.com
    smtp_password: ${O365_PASSWORD}
    smtp_from: alerts@company.com
    smtp_to:
      - oncall@company.com
    smtp_use_tls: true

  # Generic webhook for custom integrations
  webhook-monitoring:
    type: webhook
    url: https://api.example.com/v1/backup-events
    on_success: true
    webhook_method: POST  # Default is POST, can also use PUT, PATCH, etc.
    webhook_headers:
      Content-Type: application/json
      X-Service: bared-backups
    webhook_auth:
      type: bearer
      token: ${WEBHOOK_TOKEN}
    # Features:
    # - Complete JSON payload with all metrics
    # - Flexible authentication (bearer, basic, custom header)
    # - Custom HTTP headers
    # - Automatic retries (3 attempts)
    # - Works with: Zapier, n8n, Make.com, custom services

  # Webhook with basic authentication
  webhook-internal:
    type: webhook
    url: https://internal.company.com/webhooks/backups
    on_success: false
    webhook_auth:
      type: basic
      username: webhook-user
      password: ${WEBHOOK_PASSWORD}

  # Webhook with custom header authentication (e.g., API key)
  webhook-api:
    type: webhook
    url: https://api.monitoring.com/events
    on_success: true
    webhook_auth:
      type: header
      header_name: X-API-Key
      header_value: ${API_KEY}

# Backup targets
targets:
  # MySQL/MariaDB example
  - name: mysql_production
    conn:
      type: mysql
      user: backup_user
      password: ${MYSQL_PASSWORD}
      database: myapp_db
      host: localhost
      port: 3306
    exclude_tables:
      - temp_logs
      - session_data
    additional_args:
      - --single-transaction
      - --quick
    compress:
      enabled: true
      type: tgz
    storage:
      enabled: true
      name: s3
    schedule: "0 2 * * *"  # Daily at 2 AM

  # PostgreSQL example
  - name: postgres_analytics
    conn:
      type: postgres
      user: postgres
      password: ${POSTGRES_PASSWORD}
      database: analytics
      host: localhost
      port: 5432
    compress:
      enabled: true
      type: tgz
    storage:
      enabled: true
      name: local_disk
    schedule: "0 3 * * *"  # Daily at 3 AM

  # Redis example
  - name: redis_cache
    conn:
      type: redis
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
    compress:
      enabled: true
      type: tgz
    storage:
      enabled: true
      name: offsite
    schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
