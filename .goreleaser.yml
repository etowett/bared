# GoReleaser configuration for BareD
# Documentation: https://goreleaser.com

version: 2

project_name: brd

git:
  # Every release pushes two tags at the same commit: vX.Y.Z (the release) and
  # apps/api/vX.Y.Z (the Go module tag — go.mod lives at apps/api/, see #110 and
  # .github/workflows/auto-release.yml). From a commit that is *not* exactly a
  # tag, GoReleaser falls back to `git describe`, which returns the module tag,
  # and `{{ .Version }}` becomes "apps/api/v0.5.0". The "/" then turns
  # `name_template` into a nested directory, so a local snapshot produced
  # `dist/brd-apps/api/v0.5.0-SNAPSHOT-<sha>-linux-amd64.tar.gz` instead of a
  # flat archive name (#120).
  #
  # Ignoring the module tags leaves only root vX.Y.Z tags for GoReleaser to pick
  # as current *and* previous, which is the same restriction the Makefile's
  # VERSION and auto-release.yml already apply via `git describe --match
  # 'v[0-9]*'`. Globs are matched with filepath.Match and do work here (verified
  # against GoReleaser v2.17.0 — #110 predates that support), so this covers
  # every module tag, not just a hardcoded version.
  #
  # release.yml still pins GORELEASER_CURRENT_TAG to github.ref_name. That is
  # deliberate belt-and-braces: it names the exact tag being released rather
  # than inferring it, and it is never an ignored tag.
  ignore_tags:
    - "apps/api/*"

# These hooks are the *only* place the release pipeline builds and embeds
# the web UI — .github/workflows/release.yml deliberately no longer
# duplicates them (#115). GoReleaser validates git state *before* running
# these hooks, so anything that dirties the tree in an earlier pipeline step
# aborts the release outright.
before:
  hooks:
    # Build web frontend and sync to embed location
    - sh -c "cd apps/web && bun install --frozen-lockfile && bun run build"
    # The .gitkeep under apps/api/internal/web/dist is tracked (#78) so that
    # `//go:embed all:dist` matches on a fresh clone. `rm -rf` on the
    # directory deletes it and the copied build output carries no .gitkeep of
    # its own, which leaves the tree dirty — put it back so this step leaves
    # the working tree exactly as it found it.
    - sh -c "mkdir -p apps/api/internal/web && rm -rf apps/api/internal/web/dist && cp -r apps/web/dist apps/api/internal/web/dist && touch apps/api/internal/web/dist/.gitkeep"
    # Tidy dependencies
    - sh -c "cd apps/api && go mod tidy"

builds:
  - id: brd
    # The Go module is rooted at apps/api; main is relative to this dir.
    dir: apps/api
    main: ./cmd/brd
    binary: brd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/etowett/bared/apps/api/internal/version.Version={{.Version}}
      - -X github.com/etowett/bared/apps/api/internal/version.Commit={{.ShortCommit}}
      - -X github.com/etowett/bared/apps/api/internal/version.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Ignore combinations that don't make sense
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      # Bare directory names glob recursively. Do NOT use `examples/**/*`:
      # `**` requires at least one intervening directory, so that pattern
      # silently matched nothing for the flat `examples/` tree (and skipped
      # top-level files such as `docs/README.md`).
      - examples
      - docs

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  use: github-native
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: '🚀 Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: '💥 Breaking Changes'
      regexp: '^.*?!:'
      order: 1
    - title: '🐛 Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: '📚 Documentation'
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: '🔧 Maintenance'
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: 'Other Changes'
      order: 999

release:
  # No `github:` block on purpose — GoReleaser infers owner/repo from the git
  # remote, so forks release to their own repo instead of failing against this one.
  draft: false
  prerelease: auto
  mode: append
  name_template: "{{ .Tag }}"
  header: |
    ## BareD {{ .Tag }}

    Backup and Restore Daemon for databases (MySQL, PostgreSQL, Redis).

    ### Installation

    Download the appropriate binary for your platform:

    #### Linux (amd64)
    ```bash
    wget https://github.com/etowett/bared/releases/download/{{ .Tag }}/brd-{{ .Version }}-linux-amd64.tar.gz
    tar xzf brd-{{ .Version }}-linux-amd64.tar.gz
    sudo mv brd /usr/local/bin/
    sudo chmod +x /usr/local/bin/brd
    ```

    #### Linux (arm64)
    ```bash
    wget https://github.com/etowett/bared/releases/download/{{ .Tag }}/brd-{{ .Version }}-linux-arm64.tar.gz
    tar xzf brd-{{ .Version }}-linux-arm64.tar.gz
    sudo mv brd /usr/local/bin/
    sudo chmod +x /usr/local/bin/brd
    ```

    #### macOS (Intel)
    ```bash
    wget https://github.com/etowett/bared/releases/download/{{ .Tag }}/brd-{{ .Version }}-darwin-amd64.tar.gz
    tar xzf brd-{{ .Version }}-darwin-amd64.tar.gz
    sudo mv brd /usr/local/bin/
    sudo chmod +x /usr/local/bin/brd
    ```

    #### macOS (Apple Silicon)
    ```bash
    wget https://github.com/etowett/bared/releases/download/{{ .Tag }}/brd-{{ .Version }}-darwin-arm64.tar.gz
    tar xzf brd-{{ .Version }}-darwin-arm64.tar.gz
    sudo mv brd /usr/local/bin/
    sudo chmod +x /usr/local/bin/brd
    ```

    #### Windows (amd64)
    Download the `.zip` file, extract it, and add `brd.exe` to your PATH.

    ### Verify Download
    ```bash
    sha256sum -c checksums.txt
    ```

    ### Docker
    ```bash
    docker pull ektowett/bared:{{ .Version }}
    ```

  footer: |
    ---

    **Full Changelog**: https://github.com/etowett/bared/compare/{{ .PreviousTag }}...{{ .Tag }}

    ## Need Help?

    - 📖 [Documentation](https://github.com/etowett/bared/tree/main/docs)
    - 🐛 [Report Bug](https://github.com/etowett/bared/issues/new)
    - 💡 [Request Feature](https://github.com/etowett/bared/issues/new)
