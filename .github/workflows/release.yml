name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Shared with auto-release.yml and docker.yml — see the note there. Serialise the
# release chain; never cancel a half-published release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: [ubuntu-latest]
    # .goreleaser.yml hardcodes `owner: etowett`, so a fork tagging its own
    # release would fail in GoReleaser rather than skip.
    if: github.repository == 'etowett/bared'
    timeout-minutes: 30

    steps:
      # GoReleaser publishes over the GitHub API with GITHUB_TOKEN and uses git
      # read-only (`changelog.use: github-native`, no brews/scoop tap pushes),
      # so nothing in this job needs a pushable git remote.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from the module instead of duplicating it here —
          # apps/api/go.mod is the single source of truth for the Go toolchain.
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Bun must be on PATH before GoReleaser runs: .goreleaser.yml's before-hook
      # shells out to `bun install --frozen-lockfile && bun run build` itself.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: apps/web/.bun-version

      # setup-bun caches the Bun binary only — it does not touch the dependency
      # install cache — so this replaces what `cache: "npm"` used to do.
      - name: Cache Bun install cache
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('apps/web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      # No "build web / copy dist" steps here on purpose. They used to
      # duplicate .goreleaser.yml's `before` hooks verbatim, and that
      # duplication broke every release (#115): the copy step's
      # `rm -rf apps/api/internal/web/dist` deleted the tracked .gitkeep
      # (#78), and GoReleaser validates git state *before* running its own
      # hooks — so it saw a dirty tree and aborted. Building the UI only
      # inside the hooks leaves the tree pristine at validation time, and
      # makes CI run exactly what `goreleaser release --clean` runs locally.
      # The Bun setup above is what those hooks need on PATH.

      # SHA-pinned: runs with `contents: write` and GITHUB_TOKEN, and publishes
      # the release artifacts. See #85.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Two tags point at the release commit — vX.Y.Z and the Go module tag
          # apps/api/vX.Y.Z (see auto-release.yml). Left to itself GoReleaser
          # picks the first of `git tag --sort=-version:refname`, which happens
          # to be vX.Y.Z only because "apps/..." sorts before "v...". That is an
          # accident of the prefix, not a guarantee, and it decides the release
          # name, the archive names and the version stamped into the binary.
          # This workflow only ever runs for a v*.*.* tag, so github.ref_name is
          # the tag we mean — pin it instead of relying on the sort.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Generate summary
        run: |
          echo "## 🎉 Release ${{ steps.get_version.outputs.version }} Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release URL:** https://github.com/${{ github.repository }}/releases/tag/${{ steps.get_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Linux (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS (amd64, arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows (amd64)" >> $GITHUB_STEP_SUMMARY
          echo "- Checksums (SHA256)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "Docker workflow will now build and push multi-platform images (linux/amd64, linux/arm64)." >> $GITHUB_STEP_SUMMARY
