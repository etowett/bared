name: Docker Build and Push

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ektowett/bared

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: prod
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            git fetch --tags
            VERSION=$(git tag --sort=-creatordate | head -n 1)
            if [[ "$VERSION" == v*.*.* ]]; then
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "is_tag=true" >> $GITHUB_OUTPUT
            else
              echo "version=main-${COMMIT_SHA}" >> $GITHUB_OUTPUT
              echo "is_tag=false" >> $GITHUB_OUTPUT
            fi
          else
            VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "main-${COMMIT_SHA}")
            if [[ "$VERSION" == v*.*.* ]]; then
              echo "version=${VERSION}" >> $GITHUB_OUTPUT
              echo "is_tag=true" >> $GITHUB_OUTPUT
            else
              echo "version=main-${COMMIT_SHA}" >> $GITHUB_OUTPUT
              echo "is_tag=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'false' }}
          labels: |
            org.opencontainers.image.title=BareD
            org.opencontainers.image.description=Backup and Restore Daemon for databases
            org.opencontainers.image.vendor=ektowett
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: |
            type=gha,scope=buildkit-${{ github.ref_name }}
            type=gha,scope=buildkit-main
          cache-to: type=gha,mode=max,scope=buildkit-${{ github.ref_name }}

      - name: Update Docker Hub description
        if: steps.meta.outputs.is_tag == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_IMAGE }}
          short-description: "BareD - Backup and Restore Daemon for MySQL, PostgreSQL, Redis"
          readme-filepath: ./README.md
