name: Docker Build and Push

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

# Shared with auto-release.yml and release.yml — see the note there. Serialise the
# release chain; never cancel a half-pushed image.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ektowett/bared

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    environment: prod
    # The repository guard keeps this out of forks, where DOCKERHUB_USERNAME /
    # DOCKERHUB_TOKEN are empty and docker/login-action fails red.
    if: github.repository == 'etowett/bared' && (github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch')

    steps:
      # Pin the checkout to the commit the Release run was built from. Without a
      # `ref` this took whatever the default branch HEAD was at the moment the
      # workflow_run fired, so an image tagged vX.Y.Z could contain commits that
      # are not in vX.Y.Z. workflow_dispatch carries no workflow_run payload, so
      # fall back to github.sha — the SHA of the ref the dispatch was aimed at,
      # which is exactly what the operator selected.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Extract version metadata
        id: meta
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          echo "commit_sha=${COMMIT_SHA}" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

          # Both trigger paths resolve the version from the checked-out commit
          # rather than from "newest tag anywhere in the repo". The old
          # workflow_run branch used `git tag --sort=-creatordate | head -n 1`,
          # which on a busy main could name a tag the checkout does not contain.
          git fetch --tags --force
          VERSION=$(git describe --tags --exact-match 2>/dev/null || echo "")
          if [[ "$VERSION" == v*.*.* ]]; then
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            echo "version=main-${COMMIT_SHA}" >> $GITHUB_OUTPUT
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi

      # The Dockerfile builds with CGO_ENABLED=1 and no cross-compilation setup,
      # so linux/arm64 is produced under emulation. This is the same QEMU step
      # that produced the multi-arch v0.3.0-v0.3.3 images; it was dropped in #38
      # and arm64 support went with it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate Docker metadata
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=raw,value=latest,enable=${{ steps.meta.outputs.is_tag == 'true' }}
            type=raw,value=${{ steps.meta.outputs.version }},enable=${{ steps.meta.outputs.is_tag == 'false' }}
          labels: |
            org.opencontainers.image.title=BareD
            org.opencontainers.image.description=Backup and Restore Daemon for databases
            org.opencontainers.image.vendor=ektowett
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit_sha }}
            BUILD_DATE=${{ steps.meta.outputs.build_date }}
          cache-from: |
            type=gha,scope=buildkit-${{ github.ref_name }}
            type=gha,scope=buildkit-main
          cache-to: type=gha,mode=max,scope=buildkit-${{ github.ref_name }}

      - name: Update Docker Hub description
        if: steps.meta.outputs.is_tag == 'true'
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.REGISTRY_IMAGE }}
          short-description: "BareD - Backup and Restore Daemon for MySQL, PostgreSQL, Redis"
          readme-filepath: ./README.md
