name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Install database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev \
            default-mysql-client \
            postgresql-client \
            redis-tools

      - name: Create placeholder web dist
        run: |
          mkdir -p internal/web/dist
          echo "placeholder" > internal/web/dist/.placeholder

      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -race -coverprofile=coverage.out ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Create placeholder dist directory
        run: |
          mkdir -p internal/web/dist
          echo "placeholder" > internal/web/dist/.placeholder

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libsqlite3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy web dist to embed location
        run: cp -r web/dist internal/web/dist

      - name: Build binary with embedded web
        run: make build CGO=1

      - name: Validate example config
        run: make validate CGO=1
